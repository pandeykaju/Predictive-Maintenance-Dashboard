
services:
  dashboard:
    build: .
    image: predictive-maintenance-dashboard
    ports:
      - "8502:8501"
    environment:
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_EMAIL_PASSWORD: ${ALERT_EMAIL_PASSWORD:-}
      ALERT_RECEIVER: ${ALERT_RECEIVER:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api:
    build: .
    image: predictive-maintenance-dashboard
    command:
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8001:8000"
    restart: unless-stopped
